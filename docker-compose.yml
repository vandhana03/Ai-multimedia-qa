services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiqa-backend
    ports:
      - "8000:8000"
    environment:
      - USE_SQLITE=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiqa-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
